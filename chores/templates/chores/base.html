<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}FairShare{% endblock %}</title>
</head>
<body>
    <header>
        <h1><a href="{% url 'chores:person_picker' %}">FairShare</a></h1>
        <nav>
            <a href="{% url 'chores:chore_pool' %}">Chore Pool</a>
            <a href="{% url 'chores:add_chore' %}">Add Chore</a>
            <a href="{% url 'chores:leaderboard' %}">Leaderboard</a>
        </nav>
        {% if current_person %}
            <p>
                Acting as <strong>{{ current_person.name }}</strong>
                <form method="post" action="{% url 'chores:switch_person' %}" style="display:inline">
                    {% csrf_token %}
                    <button type="submit">switch</button>
                </form>
            </p>
        {% endif %}
    </header>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
